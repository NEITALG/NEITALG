<canvas id="cbo-bg" style="position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:-1;pointer-events:none;"></canvas>

<script>
(function () {
  const canvas = document.getElementById('cbo-bg');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  // ── CBO parameters ────────────────────────────────────────────────────────
  const N      = 60;
  const ALPHA  = 50;
  const LAMBDA = 1.0;
  const SIGMA  = 0.4;
  const DT     = 0.025;
  const STEPS  = 380;
  const D      = 3.5;   // domain: [-D, D]^2

  function f(x, y) {
    const A = 10;
    return 2 * A
      + x * x - A * Math.cos(2 * Math.PI * x)
      + y * y - A * Math.cos(2 * Math.PI * y);
  }

  // Gradient magnitude of Rastrigin (analytical)
  function gradF(x, y) {
    const gx = 2 * x + 20 * Math.PI * Math.sin(2 * Math.PI * x);
    const gy = 2 * y + 20 * Math.PI * Math.sin(2 * Math.PI * y);
    return Math.hypot(gx, gy);
  }

  function randn() {
    return Math.sqrt(-2 * Math.log(Math.random() + 1e-12))
         * Math.cos(2 * Math.PI * Math.random());
  }

  function toX(v) { return (v / D * 0.44 + 0.5) * canvas.width;  }
  function toY(v) { return (v / D * 0.44 + 0.5) * canvas.height; }

  // ── Contour-line background ───────────────────────────────────────────────
  const LEVELS = [3, 9, 22, 42, 65];  // iso-values of Rastrigin to draw

  let bgCache = null, bgDarkMode = null;

  function buildBackground(dark) {
    const W = canvas.width, H = canvas.height;
    if (W === 0 || H === 0) return;

    const SCALE      = 2;                         // 2× downsample for speed
    const TARGET_PX  = 1.5;                       // desired contour half-width in screen px
    const MIN_GRAD   = 1.8;                       // clamp |∇f| from below
    const iw = Math.ceil(W / SCALE), ih = Math.ceil(H / SCALE);
    const pixPerUnit = (W * 0.88) / (2 * D);     // screen px per domain unit

    const small = document.createElement('canvas');
    small.width = iw; small.height = ih;
    const sc  = small.getContext('2d');
    const img = sc.createImageData(iw, ih);
    const data = img.data;

    const [lr, lg, lb] = dark ? [200, 215, 255] : [20, 30, 80];

    for (let py = 0; py < ih; py++) {
      for (let px = 0; px < iw; px++) {
        const wx = ((px + 0.5) * SCALE / W - 0.5) / 0.44 * D;
        const wy = ((py + 0.5) * SCALE / H - 0.5) / 0.44 * D;
        const v  = f(wx, wy);

        // half-width in function units for a TARGET_PX-wide line at this gradient
        const g       = Math.max(gradF(wx, wy), MIN_GRAD);
        const halfW   = g * TARGET_PX / pixPerUnit;

        let minDist = Infinity;
        for (const L of LEVELS) {
          const d = Math.abs(v - L);
          if (d < minDist) minDist = d;
        }

        const norm  = minDist / halfW;
        const lineA = Math.exp(-norm * norm * 0.5);  // Gaussian profile

        // Radial vignette
        const dist = Math.hypot(px / iw - 0.5, py / ih - 0.5) * 2;
        const st   = Math.max(0, Math.min(1, (dist - 0.1) / 0.85));
        const fade = 1 - st * st * (3 - 2 * st);

        const k = (py * iw + px) * 4;
        data[k]     = lr;
        data[k + 1] = lg;
        data[k + 2] = lb;
        data[k + 3] = Math.round(255 * lineA * fade);
      }
    }

    sc.putImageData(img, 0, 0);
    const bg = document.createElement('canvas');
    bg.width = W; bg.height = H;
    const bc = bg.getContext('2d');
    bc.imageSmoothingEnabled = true;
    bc.imageSmoothingQuality = 'high';
    bc.drawImage(small, 0, 0, W, H);
    bgCache    = bg;
    bgDarkMode = dark;
  }

  // ── State ─────────────────────────────────────────────────────────────────
  let particles = [], step = 0;

  function reset() {
    particles = Array.from({ length: N }, () => ({
      x: (Math.random() * 2 - 1) * D,
      y: (Math.random() * 2 - 1) * D,
    }));
    step = 0;
  }

  function consensus() {
    const w  = particles.map(p => Math.exp(-ALPHA * f(p.x, p.y)));
    const ws = w.reduce((a, b) => a + b, 1e-300);
    return {
      x: particles.reduce((s, p, i) => s + w[i] * p.x, 0) / ws,
      y: particles.reduce((s, p, i) => s + w[i] * p.y, 0) / ws,
    };
  }

  function advance() {
    const c = consensus();
    particles = particles.map(p => {
      const dx = p.x - c.x, dy = p.y - c.y;
      const d  = Math.hypot(dx, dy);
      const sd = SIGMA * d * Math.sqrt(DT);
      return {
        x: p.x - LAMBDA * DT * dx + sd * randn(),
        y: p.y - LAMBDA * DT * dy + sd * randn(),
      };
    });
    if (++step >= STEPS) reset();
  }

  // ── Rendering ─────────────────────────────────────────────────────────────
  function isDark() {
    return document.documentElement.getAttribute('data-theme') === 'dark'
        || window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  function draw() {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    const dark = isDark();
    if (bgDarkMode !== dark) buildBackground(dark);  // rebuild on theme switch

    if (bgCache) {
      ctx.globalAlpha = dark ? 0.45 : 0.22;
      ctx.drawImage(bgCache, 0, 0);
      ctx.globalAlpha = 1.0;
    }

    const c    = consensus();
    const cpx  = toX(c.x), cpy = toY(c.y);

    const colParticle  = dark ? 'rgba(220,235,255,0.75)' : 'rgba(255,255,255,0.70)';
    const colLine      = dark ? 'rgba(255,255,255,0.018)' : 'rgba(20,20,40,0.018)';
    const colConsensus = dark ? 'rgba(255,220,50,0.95)'   : 'rgba(230,100,10,0.90)';

    ctx.strokeStyle = colLine;
    ctx.lineWidth   = 1;
    particles.forEach(p => {
      ctx.beginPath();
      ctx.moveTo(toX(p.x), toY(p.y));
      ctx.lineTo(cpx, cpy);
      ctx.stroke();
    });

    ctx.fillStyle = colParticle;
    particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(toX(p.x), toY(p.y), 3, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.shadowBlur  = 20;
    ctx.shadowColor = colConsensus;
    ctx.beginPath();
    ctx.arc(cpx, cpy, 6, 0, Math.PI * 2);
    ctx.fillStyle = colConsensus;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // ── Lifecycle ─────────────────────────────────────────────────────────────
  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    buildBackground(isDark());
  }

  let timer = null;

  function start() {
    if (timer) return;
    timer = setInterval(() => { advance(); draw(); }, 67); // ~15 fps
  }

  function stop() {
    clearInterval(timer);
    timer = null;
  }

  document.addEventListener('visibilitychange', () =>
    document.hidden ? stop() : start()
  );

  window.addEventListener('resize', resize);

  resize();
  reset();
  start();
})();
</script>
