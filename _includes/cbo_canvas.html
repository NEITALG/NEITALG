<canvas id="cbo-bg" style="position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:-1;pointer-events:none;"></canvas>

<script>
(function () {
  const canvas = document.getElementById('cbo-bg');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  // ── CBO parameters ────────────────────────────────────────────────────────
  const N      = 60;
  const ALPHA  = 50;
  const LAMBDA = 1.0;
  const SIGMA  = 0.4;
  const DT     = 0.025;
  const STEPS  = 380;   // safety cap on the length of one run

  // Restart cycle (in frames at ~15 fps). A run ends once the swarm has
  // collapsed to COLLAPSE_PX on screen; without this, roughly the second
  // half of every run used to show a static dot.
  const COLLAPSE_PX = 4;
  const HOLD_FRAMES = 15;   // ~1 s showing the converged swarm
  const FADE_FRAMES = 10;   // ~0.7 s fade out, and again fade in
  const D      = 3.5;   // half-extent of the shorter screen side in world units

  // Where the global minimum sits, as a fraction of the viewport. On wide
  // screens it goes to the right, beside the content column, so the swarm
  // converges where it is not covered by the repo cards; on narrow screens
  // it goes towards the bottom.
  const MIN_WIDE   = [0.80, 0.62];
  const MIN_NARROW = [0.50, 0.82];

  let S = 1;                  // pixels per world unit (same on both axes)
  let minX = 0, minY = 0;     // global minimum in world coordinates

  function f(x, y) {
    const A = 10;
    const u = x - minX, v = y - minY;
    return 2 * A
      + u * u - A * Math.cos(2 * Math.PI * u)
      + v * v - A * Math.cos(2 * Math.PI * v);
  }

  function randn() {
    return Math.sqrt(-2 * Math.log(Math.random() + 1e-12))
         * Math.cos(2 * Math.PI * Math.random());
  }

  // World <-> screen with one isotropic scale, so wells stay round on any
  // aspect ratio.
  function toX(v) { return canvas.width  / 2 + v * S; }
  function toY(v) { return canvas.height / 2 + v * S; }
  function fromX(px) { return (px - canvas.width  / 2) / S; }
  function fromY(py) { return (py - canvas.height / 2) / S; }

  function updateGeometry() {
    const W = canvas.width, H = canvas.height;
    S = Math.min(W, H) * 0.44 / D;
    const [fx, fy] = W / H > 1.3 ? MIN_WIDE : MIN_NARROW;
    minX = fromX(fx * W);
    minY = fromY(fy * H);
  }

  // ── Aurora heatmap background ─────────────────────────────────────────────
  // Warm coral → rose → violet → deep indigo (Anthropic-style aurora palette)
  function auroraColor(t) {
    const stops = [
      [0.00, [255, 145,  90]],  // warm coral   — global minimum
      [0.25, [210,  80, 155]],  // rose pink
      [0.55, [105,  55, 210]],  // violet
      [0.80, [ 28,  18, 115]],  // deep indigo
      [1.00, [  7,   4,  22]],  // near black
    ];
    let i = 0;
    while (i < stops.length - 2 && t > stops[i + 1][0]) i++;
    const [t0, c0] = stops[i], [t1, c1] = stops[i + 1];
    const s = Math.max(0, Math.min(1, (t - t0) / (t1 - t0)));
    return [
      Math.round(c0[0] + s * (c1[0] - c0[0])),
      Math.round(c0[1] + s * (c1[1] - c0[1])),
      Math.round(c0[2] + s * (c1[2] - c0[2])),
    ];
  }

  let bgCache = null, bgDarkMode = null;

  function buildBackground(dark) {
    const W = canvas.width, H = canvas.height;
    if (W === 0 || H === 0) return;

    const SCALE = 3;
    const GRAIN = 28;
    const fMax  = 75;
    const iw = Math.ceil(W / SCALE), ih = Math.ceil(H / SCALE);
    // Centre the vignette on the global minimum so its glow is not faded out.
    const vx = toX(minX) / W, vy = toY(minY) / H;

    const small = document.createElement('canvas');
    small.width = iw; small.height = ih;
    const sc  = small.getContext('2d');
    const img = sc.createImageData(iw, ih);
    const data = img.data;

    for (let py = 0; py < ih; py++) {
      for (let px = 0; px < iw; px++) {
        const wx = fromX((px + 0.5) * SCALE);
        const wy = fromY((py + 0.5) * SCALE);
        // t=0 at minima (coral), t=1 at maxima (dark indigo)
        const t  = Math.min(1, Math.max(0, f(wx, wy) / fMax));
        const [r, g, b] = auroraColor(t);
        const n = (Math.random() - 0.5) * GRAIN;

        // Alpha: power-law so minima glow warmly, ridges stay semi-visible
        const glowA = Math.pow(1 - t, 1.4);

        // Radial vignette
        const dist = Math.hypot(px / iw - vx, py / ih - vy) * 2;
        const st   = Math.max(0, Math.min(1, (dist - 0.1) / 0.85));
        const fade = 1 - st * st * (3 - 2 * st);

        const k = (py * iw + px) * 4;
        data[k]     = Math.max(0, Math.min(255, r + n));
        data[k + 1] = Math.max(0, Math.min(255, g + n));
        data[k + 2] = Math.max(0, Math.min(255, b + n));
        data[k + 3] = Math.round(255 * glowA * fade);
      }
    }

    sc.putImageData(img, 0, 0);
    const bg = document.createElement('canvas');
    bg.width = W; bg.height = H;
    const bc = bg.getContext('2d');
    bc.imageSmoothingEnabled = true;
    bc.imageSmoothingQuality = 'high';
    bc.drawImage(small, 0, 0, W, H);
    bgCache    = bg;
    bgDarkMode = dark;
  }

  // ── State ─────────────────────────────────────────────────────────────────
  let particles = [], step = 0;
  // phase: 'run' -> 'hold' -> 'fadeOut' -> reset() -> 'run' (fading in)
  let phase = 'run', phaseFrame = 0, particleAlpha = 0;

  function reset() {
    // Spread the initial swarm over the whole visible area.
    const hx = canvas.width / (2 * S), hy = canvas.height / (2 * S);
    particles = Array.from({ length: N }, () => ({
      x: (Math.random() * 2 - 1) * hx,
      y: (Math.random() * 2 - 1) * hy,
    }));
    step = 0;
  }

  function consensus() {
    // Shift by the smallest value before exponentiating (as in CBXpy):
    // otherwise exp(-ALPHA * f) underflows to 0 for every particle with
    // f > ~15 and the weighted mean silently collapses to the origin.
    const fs   = particles.map(p => f(p.x, p.y));
    const fmin = Math.min(...fs);
    const w    = fs.map(v => Math.exp(-ALPHA * (v - fmin)));
    const ws   = w.reduce((a, b) => a + b, 0);
    return {
      x: particles.reduce((s, p, i) => s + w[i] * p.x, 0) / ws,
      y: particles.reduce((s, p, i) => s + w[i] * p.y, 0) / ws,
    };
  }

  // One CBO step. Returns the mean on-screen distance (px) of the particles
  // to the consensus point.
  function cboStep() {
    const c = consensus();
    let spread = 0;
    particles = particles.map(p => {
      const dx = p.x - c.x, dy = p.y - c.y;
      const d  = Math.hypot(dx, dy);
      spread += d;
      const sd = SIGMA * d * Math.sqrt(DT);
      return {
        x: p.x - LAMBDA * DT * dx + sd * randn(),
        y: p.y - LAMBDA * DT * dy + sd * randn(),
      };
    });
    step++;
    return spread / particles.length * S;
  }

  // One animation frame: advance the dynamics and the restart cycle.
  function advance() {
    phaseFrame++;
    if (phase === 'run') {
      particleAlpha = Math.min(1, phaseFrame / FADE_FRAMES);   // fade in
      const spread = cboStep();
      if (spread < COLLAPSE_PX || step >= STEPS) { phase = 'hold'; phaseFrame = 0; }
    } else if (phase === 'hold') {
      cboStep();   // keep the converged swarm gently jittering
      if (phaseFrame >= HOLD_FRAMES) { phase = 'fadeOut'; phaseFrame = 0; }
    } else {       // 'fadeOut'
      cboStep();
      particleAlpha = Math.max(0, 1 - phaseFrame / FADE_FRAMES);
      if (phaseFrame >= FADE_FRAMES) {
        reset();
        phase = 'run'; phaseFrame = 0; particleAlpha = 0;
      }
    }
  }

  // ── Rendering ─────────────────────────────────────────────────────────────
  function isDark() {
    const theme = document.documentElement.getAttribute('data-theme');
    if (theme === 'dark')  return true;
    if (theme === 'light') return false;
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  function draw() {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    const dark = isDark();
    if (bgDarkMode !== dark) buildBackground(dark);  // rebuild on theme switch

    if (bgCache) {
      ctx.globalAlpha = dark ? 0.40 : 0.38;
      ctx.drawImage(bgCache, 0, 0);
      ctx.globalAlpha = 1.0;
    }

    const c    = consensus();
    const cpx  = toX(c.x), cpy = toY(c.y);

    // Particles, lines and the consensus dot fade together during restarts.
    ctx.globalAlpha = particleAlpha;

    const colParticle  = dark ? 'rgba(220,235,255,0.75)' : 'rgba(30, 18, 80, 0.65)';
    const colLine      = dark ? 'rgba(255,255,255,0.018)' : 'rgba(20,20,40,0.018)';
    const colConsensus = dark ? 'rgba(255,220,50,0.95)'   : 'rgba(230,100,10,0.90)';

    ctx.strokeStyle = colLine;
    ctx.lineWidth   = 1;
    particles.forEach(p => {
      ctx.beginPath();
      ctx.moveTo(toX(p.x), toY(p.y));
      ctx.lineTo(cpx, cpy);
      ctx.stroke();
    });

    ctx.fillStyle = colParticle;
    particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(toX(p.x), toY(p.y), 3, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.shadowBlur  = 20;
    ctx.shadowColor = colConsensus;
    ctx.beginPath();
    ctx.arc(cpx, cpy, 6, 0, Math.PI * 2);
    ctx.fillStyle = colConsensus;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1.0;
  }

  // ── Lifecycle ─────────────────────────────────────────────────────────────
  // Respect the OS "reduce motion" setting: show a single still frame.
  const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  const reducedMotion = () => motionQuery.matches;

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    updateGeometry();
    buildBackground(isDark());
    if (reducedMotion() && particles.length) draw();
  }

  let timer = null;

  function start() {
    if (timer || reducedMotion()) return;
    timer = setInterval(() => { advance(); draw(); }, 67); // ~15 fps
  }

  function stop() {
    clearInterval(timer);
    timer = null;
  }

  document.addEventListener('visibilitychange', () =>
    document.hidden ? stop() : start()
  );

  window.addEventListener('resize', resize);

  motionQuery.addEventListener('change', () => {
    if (reducedMotion()) { stop(); particleAlpha = 1; draw(); } else { start(); }
  });

  // Redraw the still frame when the theme toggle changes data-theme.
  new MutationObserver(() => { if (reducedMotion()) draw(); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  resize();
  reset();
  // For the still frame, show the swarm part-way to consensus rather than
  // the random start, so it still tells the story.
  if (reducedMotion()) {
    for (let i = 0; i < 60; i++) cboStep();
    particleAlpha = 1;
  }
  draw();
  start();
})();
</script>
