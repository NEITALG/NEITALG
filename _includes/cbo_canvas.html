<canvas id="cbo-bg" style="position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:-1;pointer-events:none;"></canvas>

<script>
(function () {
  const canvas = document.getElementById('cbo-bg');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  // ── CBO parameters ────────────────────────────────────────────────────────
  const N      = 60;
  const ALPHA  = 50;
  const LAMBDA = 1.0;
  const SIGMA  = 0.4;
  const DT     = 0.025;
  const STEPS  = 380;
  const D      = 3.5;   // domain: [-D, D]^2

  function f(x, y) {
    const A = 10;
    const b = -2;
    return 2 * A
      + x * x - A * Math.cos(2 * Math.PI * x)
      + (y - b) * (y - b) - A * Math.cos(2 * Math.PI * (y - b));
  }

  function randn() {
    return Math.sqrt(-2 * Math.log(Math.random() + 1e-12))
         * Math.cos(2 * Math.PI * Math.random());
  }

  function toX(v) { return (v / D * 0.44 + 0.5) * canvas.width;  }
  function toY(v) { return (v / D * 0.44 + 0.5) * canvas.height; }

  // ── Aurora heatmap background ─────────────────────────────────────────────
  // Warm coral → rose → violet → deep indigo (Anthropic-style aurora palette)
  function auroraColor(t) {
    const stops = [
      [0.00, [255, 145,  90]],  // warm coral   — global minimum
      [0.25, [210,  80, 155]],  // rose pink
      [0.55, [105,  55, 210]],  // violet
      [0.80, [ 28,  18, 115]],  // deep indigo
      [1.00, [  7,   4,  22]],  // near black
    ];
    let i = 0;
    while (i < stops.length - 2 && t > stops[i + 1][0]) i++;
    const [t0, c0] = stops[i], [t1, c1] = stops[i + 1];
    const s = Math.max(0, Math.min(1, (t - t0) / (t1 - t0)));
    return [
      Math.round(c0[0] + s * (c1[0] - c0[0])),
      Math.round(c0[1] + s * (c1[1] - c0[1])),
      Math.round(c0[2] + s * (c1[2] - c0[2])),
    ];
  }

  let bgCache = null, bgDarkMode = null;

  function buildBackground(dark) {
    const W = canvas.width, H = canvas.height;
    if (W === 0 || H === 0) return;

    const SCALE = 3;
    const GRAIN = 28;
    const fMax  = 75;
    const iw = Math.ceil(W / SCALE), ih = Math.ceil(H / SCALE);

    const small = document.createElement('canvas');
    small.width = iw; small.height = ih;
    const sc  = small.getContext('2d');
    const img = sc.createImageData(iw, ih);
    const data = img.data;

    for (let py = 0; py < ih; py++) {
      for (let px = 0; px < iw; px++) {
        const wx = ((px + 0.5) * SCALE / W - 0.5) / 0.44 * D;
        const wy = ((py + 0.5) * SCALE / H - 0.5) / 0.44 * D;
        // t=0 at minima (coral), t=1 at maxima (dark indigo)
        const t  = Math.min(1, Math.max(0, f(wx, wy) / fMax));
        const [r, g, b] = auroraColor(t);
        const n = (Math.random() - 0.5) * GRAIN;

        // Alpha: power-law so minima glow warmly, ridges stay semi-visible
        const glowA = Math.pow(1 - t, 1.4);

        // Radial vignette
        const dist = Math.hypot(px / iw - 0.5, (py + 50) / ih - 0.5) * 2;
        const st   = Math.max(0, Math.min(1, (dist - 0.1) / 0.85));
        const fade = 1 - st * st * (3 - 2 * st);

        const k = (py * iw + px) * 4;
        data[k]     = Math.max(0, Math.min(255, r + n));
        data[k + 1] = Math.max(0, Math.min(255, g + n));
        data[k + 2] = Math.max(0, Math.min(255, b + n));
        data[k + 3] = Math.round(255 * glowA * fade);
      }
    }

    sc.putImageData(img, 0, 0);
    const bg = document.createElement('canvas');
    bg.width = W; bg.height = H;
    const bc = bg.getContext('2d');
    bc.imageSmoothingEnabled = true;
    bc.imageSmoothingQuality = 'high';
    bc.drawImage(small, 0, 0, W, H);
    bgCache    = bg;
    bgDarkMode = dark;
  }

  // ── State ─────────────────────────────────────────────────────────────────
  let particles = [], step = 0;

  function reset() {
    particles = Array.from({ length: N }, () => ({
      x: (Math.random() * 2 - 1) * D,
      y: (Math.random() * 2 - 1) * D,
    }));
    step = 0;
  }

  function consensus() {
    const w  = particles.map(p => Math.exp(-ALPHA * f(p.x, p.y)));
    const ws = w.reduce((a, b) => a + b, 1e-300);
    return {
      x: particles.reduce((s, p, i) => s + w[i] * p.x, 0) / ws,
      y: particles.reduce((s, p, i) => s + w[i] * p.y, 0) / ws,
    };
  }

  function advance() {
    const c = consensus();
    particles = particles.map(p => {
      const dx = p.x - c.x, dy = p.y - c.y;
      const d  = Math.hypot(dx, dy);
      const sd = SIGMA * d * Math.sqrt(DT);
      return {
        x: p.x - LAMBDA * DT * dx + sd * randn(),
        y: p.y - LAMBDA * DT * dy + sd * randn(),
      };
    });
    if (++step >= STEPS) reset();
  }

  // ── Rendering ─────────────────────────────────────────────────────────────
  function isDark() {
    return document.documentElement.getAttribute('data-theme') === 'dark'
        || window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  function draw() {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    const dark = isDark();
    if (bgDarkMode !== dark) buildBackground(dark);  // rebuild on theme switch

    if (bgCache) {
      ctx.globalAlpha = dark ? 0.40 : 0.22;
      ctx.drawImage(bgCache, 0, 0);
      ctx.globalAlpha = 1.0;
    }

    const c    = consensus();
    const cpx  = toX(c.x), cpy = toY(c.y);

    const colParticle  = dark ? 'rgba(220,235,255,0.75)' : 'rgba(30, 18, 80, 0.65)';
    const colLine      = dark ? 'rgba(255,255,255,0.018)' : 'rgba(20,20,40,0.018)';
    const colConsensus = dark ? 'rgba(255,220,50,0.95)'   : 'rgba(230,100,10,0.90)';

    ctx.strokeStyle = colLine;
    ctx.lineWidth   = 1;
    particles.forEach(p => {
      ctx.beginPath();
      ctx.moveTo(toX(p.x), toY(p.y));
      ctx.lineTo(cpx, cpy);
      ctx.stroke();
    });

    ctx.fillStyle = colParticle;
    particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(toX(p.x), toY(p.y), 3, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.shadowBlur  = 20;
    ctx.shadowColor = colConsensus;
    ctx.beginPath();
    ctx.arc(cpx, cpy, 6, 0, Math.PI * 2);
    ctx.fillStyle = colConsensus;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // ── Lifecycle ─────────────────────────────────────────────────────────────
  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    buildBackground(isDark());
  }

  let timer = null;

  function start() {
    if (timer) return;
    timer = setInterval(() => { advance(); draw(); }, 67); // ~15 fps
  }

  function stop() {
    clearInterval(timer);
    timer = null;
  }

  document.addEventListener('visibilitychange', () =>
    document.hidden ? stop() : start()
  );

  window.addEventListener('resize', resize);

  resize();
  reset();
  start();
})();
</script>
